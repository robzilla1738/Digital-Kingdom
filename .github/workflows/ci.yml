name: ci
on: [push, pull_request]
permissions: { contents: read }
env:
  VITE_DK_BUILD: ${{ github.sha }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:fixtures
      - run: pnpm build
      # R02.2: real OpenTelemetry Collector binary (pinned release, checksum-verified) against the OTLP endpoint
      - name: Collector conformance (otelcol 0.112.0)
        run: |
          curl -sSL -o "$RUNNER_TEMP/otelcol.tgz" https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.112.0/otelcol_0.112.0_linux_amd64.tar.gz
          echo "0249feb53dc32c0960be0ca6b96c858b1e299c7b06ebb987ba3437d7c4531b99  $RUNNER_TEMP/otelcol.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/otelcol.tgz" -C "$RUNNER_TEMP" otelcol
          OTELCOL_BIN="$RUNNER_TEMP/otelcol" npx vitest run examples/reference-app/collector.test.ts

  # Browser pilot: real server process + worker, fresh temp DB, reference app via the real SDK,
  # the built web app in Chromium, and a stdio MCP client. 3D uses SwiftShader software WebGL; the 3D test
  # fails (never passes on the fallback) if no WebGL context or a blank frame is produced.
  browser-pilot:
    # pinned: Playwright 1.56's --with-deps installer targets known distro releases, and ubuntu-latest
    # began migrating to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Isolate fresh CI evidence from the frozen handoff
        run: |
          if [ -d artifacts/redesign/final ]; then
            preserved="$(mktemp -d "${RUNNER_TEMP}/dk-handoff.XXXXXX")"
            mv artifacts/redesign/final "$preserved/final"
          fi
          mkdir -p artifacts/redesign/final
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm pilot
      - run: pnpm pilot:redesign
      - name: Upload pilot and redesign evidence (screenshots, sanitized logs, JSON results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pilot-evidence
          path: |
            artifacts/pilot/screens/
            artifacts/pilot/results.json
            artifacts/pilot/pilot-observations.json
            artifacts/pilot/server.log
            artifacts/redesign/final/screenshots/
            artifacts/redesign/final/*.json
          retention-days: 14
