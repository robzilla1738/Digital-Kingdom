name: demo-pages
# Publishes the OFFLINE synthetic demo (no server, bundled fixtures, same engine in the browser) to the
# gh-pages branch. This does not deploy the backend or the MCP server.
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: DK_BASE=/${{ github.event.repository.name }}/ pnpm --filter @dk/web build
      - name: Push to gh-pages
        run: |
          cd apps/web/dist
          touch .nojekyll
          cp index.html 404.html
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy offline demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
