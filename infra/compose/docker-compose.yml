# Local demo / single-node profile. Binds to localhost only. Not a hardened production deployment:
# put TLS in front, set DK_DEMO_MODE=false, DK_SECURE_COOKIES=true, and a DK_ADMIN_TOKEN secret.
services:
  digital-kingdom:
    build: { context: ../.., dockerfile: Dockerfile }
    ports: ["127.0.0.1:8787:8787"]
    environment:
      DK_DEMO_MODE: "true"        # anonymous read-only access to the SYNTHETIC demo project only
      DK_SEED_DEMO: "true"
      # DK_ADMIN_TOKEN: change-me  # otherwise a bootstrap admin token is printed once at first start
      # DK_PLANNER_URL: https://api.openai.com/v1/chat/completions   # optional AI layout planner
      # DK_PLANNER_API_KEY: ...
    volumes: ["dk-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
volumes:
  dk-data: {}
